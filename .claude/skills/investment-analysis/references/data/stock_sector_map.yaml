# Individual stock ticker → sector + region.
#
# Schema:
#   <TICKER>: { sector, region, market_cap, [issuer] }
#
# Sectors follow the GICS 11-sector framework:
#   communication_services | consumer_discretionary | consumer_staples |
#   energy | financials | healthcare | industrials | materials |
#   real_estate | technology | utilities
#
# Region: us | intl_developed | emerging
# Market cap: large | mid | small  (cutoffs: $10B / $2B)
#
# Ships with common large-caps. User-specific additions live in their local
# investment_analysis_config.yaml under `stock_overrides`.

