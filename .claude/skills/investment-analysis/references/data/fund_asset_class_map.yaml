# Curated ticker → asset class registry.
#
# Each entry follows this schema:
#   <TICKER>:
#     name: <fund name>
#     category: <broad category>
#     asset_classes: { <asset_class>: <weight 0.0-1.0>, ... }   # must sum to 1.0
#     expense_ratio: <annual %>
#     distribution_character: <qualified_dividend|ordinary|muni|mixed|...>
#     index: <tracked index>                                    # ETFs only
#     implied_sector_weights: { <sector>: <weight>, ... }       # broad funds only
#     last_verified: <ISO date>
#
# Refresh annually — implied_sector_weights drift with index rebalancing.
#
# This file ships with the skill. User-specific additions go in the local
# investment_analysis_config.yaml under `fund_overrides`.

last_refresh: 2026-05-01

