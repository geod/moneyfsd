# Default keyword taxonomy. Order within each (Category, Subcategory) doesn't
# matter, but order ACROSS categories does — the consolidate.py categorizer
# checks categories in the order they appear here, with first match winning.
#
# Place narrower buckets BEFORE broader ones (e.g., "Costco Gas" should hit
# Auto & Transport / Fuel before Shopping & Retail / Big Box).
#
# UPDATE 2026-04-26: Moved Charity & Gifts to top so date-specific gift overrides
# are evaluated early, before generic shopping keywords can misclassify them.

# ---------- Charity & Gifts ----------
# Catch gifts and donations (especially date-specific overrides like Brother's gift).
# This comes early to prevent generic shopping/hobby keywords from catching gifts.
Charity & Gifts:
  Gifts:
    - gift
    - xmas
    - birthday
  Charity:
    - donation
    - charity
    - non-profit
    - nonprofit
    - fundrais
    - gofundme
    - givelively
    - redcross
    - united way
    - salvation army
    - goodwill

# ---------- Holiday Home ----------
# Carved out from Housing so the user can see second-home spend separately.
# Comes BEFORE Housing so location-specific keywords match first.
#
# This block is INTENTIONALLY EMPTY in the default taxonomy — every user's
# holiday home is in a different town, with different utilities, county, and
# mortgage servicer. The interview phase asks for these signals and the
# planner injects them as `overrides` in the user's expenses_config.yaml.
#
# Example overrides a user might add (do NOT add to the default taxonomy):
#   - description: Aspen vacation home utilities
#     match: { description_contains: holy cross energy }
#     category: Holiday Home
#     subcategory: Utilities
Holiday Home: {}

# ---------- Housing ----------
